<div class="converter-container">
  <div class="converter-card">
    
    <div class="category-tabs-wrapper">
      <button 
        *ngFor="let cat of categorias" 
        (click)="categoriaSeleccionada = cat; onCategoriaChange()"
        [ngClass]="{
          'tab-active': categoriaSeleccionada === cat,
          'tab-inactive': categoriaSeleccionada !== cat
        }"
        class="category-tab-btn">
        <i class="mr-2" [ngClass]="{
          'fa-solid fa-ruler': cat === 'Longitud',
          'fa-solid fa-weight-hanging': cat === 'Peso / Masa',
          'fa-solid fa-temperature-half': cat === 'Temperatura'
        }"></i>
        {{ cat }}
      </button>
    </div>

    <div class="converter-body">
      <div class="converter-grid">
        
        <div class="input-block">
          <label class="block-label">Desde</label>
          <select [(ngModel)]="unidadOrigen" (change)="convertir()" class="select-field">
            <option *ngFor="let uni of unidadesPorCategoria[categoriaSeleccionada]" [value]="uni">{{ uni }}</option>
          </select>
          <input type="number" [(ngModel)]="valorOrigen" (input)="convertir()" class="input-field" placeholder="0">
        </div>

        <div class="divider-icon-zone">
  <div (click)="intercambiarUnidades()" class="circle-icon cursor-pointer hover:bg-indigo-100 transition-colors duration-150" title="Intercambiar unidades">
    <i class="fa-solid fa-right-left rotate-90 md:rotate-0"></i>
  </div>
</div>

        <div class="input-block">
          <label class="block-label">A</label>
          <select [(ngModel)]="unidadDestino" (change)="convertir()" class="select-field">
            <option *ngFor="let uni of unidadesPorCategoria[categoriaSeleccionada]" [value]="uni">{{ uni }}</option>
          </select>
          <div class="result-display-field">
            {{ valorDestino }}
          </div>
        </div>

      </div>

      <div class="info-footer-box">
        <i class="fa-solid fa-circle-info text-indigo-500 text-base"></i>
        <span>Los valores calculados incluyen redondeo automático adaptativo para garantizar la máxima precisión en pantalla.</span>
      </div>
    </div>

  </div>
</div>
