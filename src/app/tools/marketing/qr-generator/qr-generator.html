<div class="qr-container animate-fade-in">
  
  <header class="qr-header">
    <div class="qr-icon-badge">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 013.75 9.375v-4.5zM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c0 .621.504 1.125 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 01-1.125-1.125v-4.5zM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0113.5 9.375v-4.5zM13.5 14.625c0-.621.504-1.125 1.125-1.125h1.5a1.125 1.125 0 011.125 1.125v1.5a1.125 1.125 0 01-1.125 1.125h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5zM17.625 17.625a1.125 1.125 0 011.125-1.125h1.5a1.125 1.125 0 011.125 1.125v1.5a1.125 1.125 0 01-1.125 1.125h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5zM13.5 19.125a1.125 1.125 0 011.125-1.125h1.5a1.125 1.125 0 011.125 1.125v1.5a1.125 1.125 0 01-1.125 1.125h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5z" />
      </svg>
    </div>
    <div>
      <h2 class="qr-title">Generador de códigos QR</h2>
      <p class="qr-subtitle">Convierte cualquier enlace, texto o número en un código QR dinámico listo para imprimir.</p>
    </div>
  </header>

  <div class="input-wrapper">
    <label class="input-label">Enlace o Contenido</label>
    <div class="input-relative">
      <input 
        type="text" 
        [(ngModel)]="texto" 
        (input)="generarQR()" 
        placeholder="Ej: https://misitio.com o un mensaje personalizado..."
        class="qr-input"
      />
      @if (texto) {
        <button (click)="limpiarTexto()" class="clear-btn" title="Limpiar texto">✕</button>
      }
    </div>
  </div>
  
  <div class="preview-zone">
    
    @if (!qrImage) {
      <div class="empty-state">
        <div class="empty-qr-box">
          <div class="scan-line"></div>
        </div>
        <p class="empty-text">Esperando que escribas algo para generar el código...</p>
      </div>
    }

    @if (qrImage) {
      <div class="qr-active-wrapper">
        <div class="image-frame">
          <img [src]="qrImage" alt="Código QR Generado" class="qr-image" />
        </div>
        
        <div class="action-grid">
          <button (click)='descargarQR()' class="btn-primary">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
            </svg>
            Descargar PNG
          </button>
        </div>
      </div>
    }
  </div>

</div>
