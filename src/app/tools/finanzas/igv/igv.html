<div class="p-6 max-w-sm mx-auto bg-white rounded-xl shadow-md space-y-4 mt-10">
  <h2 class="text-xl font-bold text-slate-900">Calculadora de IGV (18%)</h2>
  <div>
    <label class="block text-sm font-medium text-slate-700">Monto Base (S/)</label>
    <input type="number" [(ngModel)]="monto" (input)="calcular()" 
           class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
  </div>
  <div class="bg-slate-50 p-3 rounded-md">
    <p class="text-sm text-slate-600">IGV: <span class="font-bold">S/ {{igv | number:'1.2-2'}}</span></p>
    <p class="text-lg text-slate-900 font-bold">Total: S/ {{total | number:'1.2-2'}}</p>
  </div>
</div>
