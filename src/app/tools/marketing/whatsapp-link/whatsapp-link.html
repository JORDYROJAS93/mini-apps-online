<div class="max-w-2xl mx-auto mt-10 p-8 bg-white rounded-3xl shadow-xl border border-gray-100">
  <div class="flex items-center space-x-3 mb-8">
    <div class="bg-green-500 p-2 rounded-xl shadow-lg shadow-green-100">
      <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.438 9.889-9.886.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
    </div>
    <h2 class="text-2xl font-extrabold text-gray-800 tracking-tight">Generador de Link de WhatsApp</h2>
  </div>

  <div class="space-y-5">
    <div>
      <label class="block text-sm font-bold text-gray-700 mb-1">Número de Teléfono</label>
      <input type="text" [(ngModel)]="telefono" (input)="generarLink()" placeholder="Ej: 51987654321 (con código de país)"
        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none transition">
      <p class="text-xs text-gray-400 mt-1 italic">Incluye el código de país sin el símbolo +</p>
    </div>

    <div>
      <label class="block text-sm font-bold text-gray-700 mb-1">Mensaje de Bienvenida (Opcional)</label>
      <textarea [(ngModel)]="mensaje" (input)="generarLink()" rows="3" placeholder="Hola, me gustaría más información sobre..."
        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none transition"></textarea>
    </div>

    <div *ngIf="enlaceGenerado" class="mt-8 animate-fade-in">
      <div class="p-4 bg-green-50 rounded-2xl border border-green-100 flex flex-col space-y-3">
        <label class="text-xs font-bold text-green-700 uppercase tracking-wider">Tu enlace está listo:</label>
        <div class="bg-white p-3 rounded-lg border border-green-200 text-sm font-mono text-green-800 break-all select-all">
          {{ enlaceGenerado }}
        </div>
        <button (click)="copiarEnlace()" 
          class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-green-200 transition-all flex items-center justify-center space-x-2">
          <span>Copiar Enlace</span>
        </button>
      </div>
    </div>
  </div>
</div>
