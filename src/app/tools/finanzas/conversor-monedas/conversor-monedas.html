<div class="max-w-2xl mx-auto my-8 p-6 bg-white rounded-2xl shadow-lg border border-gray-100">
  <div class="text-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800 flex justify-center items-center gap-2">
      💱 Conversor de Monedas
    </h2>
    <p class="text-sm text-gray-500 mt-1">Calcula tipos de cambio en tiempo real de forma rápida.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-7 gap-4 items-center">
    
    <div class="md:col-span-2">
      <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Monto</label>
      <input 
        type="number" 
        [(ngModel)]="monto" 
        (input)="calcularConversion()"
        class="w-full px-3 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium text-gray-700"
        placeholder="0.00"
        min="0"
      />
    </div>

    <div class="md:col-span-2">
      <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">De</label>
      <select 
        [(ngModel)]="monedaOrigen" 
        (change)="calcularConversion()"
        class="w-full px-3 py-2.5 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-700"
      >
        <option *ngFor="let m of monedas" [value]="m.codigo">{{ m.nombre }}</option>
      </select>
    </div>

    <div class="md:col-span-1 flex justify-center pt-4 md:pt-0">
      <button 
        (click)="invertirMonedas()"
        type="button"
        class="p-2.5 bg-gray-100 hover:bg-blue-50 text-gray-600 hover:text-blue-600 rounded-full transition-colors shadow-sm border border-gray-200"
        title="Invertir monedas"
      >
        🔄
      </button>
    </div>

    <div class="md:col-span-2">
      <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">A</label>
      <select 
        [(ngModel)]="monedaDestino" 
        (change)="calcularConversion()"
        class="w-full px-3 py-2.5 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-700"
      >
        <option *ngFor="let m of monedas" [value]="m.codigo">{{ m.nombre }}</option>
      </select>
    </div>

  </div>

  <div class="mt-8 p-5 bg-gradient-to-r from-blue-50 to-indigo-50 rounded-2xl border border-blue-100 text-center">
    <span class="text-sm text-gray-500 block mb-1">Resultado de la conversión</span>
    <div class="text-3xl font-extrabold text-slate-800">
      {{ monto | number:'1.2-2' }} <span class="text-lg font-bold text-blue-600">{{ monedaOrigen }}</span>
      <span class="text-gray-400 mx-2">=</span>
      {{ resultado | number:'1.2-2' }} <span class="text-lg font-bold text-green-600">{{ monedaDestino }}</span>
    </div>
    <span class="text-[11px] text-gray-400 block mt-2">
      * Tasas de cambio referenciales.
    </span>
  </div>
</div>
