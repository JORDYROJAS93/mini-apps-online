<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">Generador de Password</h2>
  
  <div class="bg-gray-900 text-green-400 p-4 rounded-xl font-mono text-xl mb-6 flex justify-between items-center break-all shadow-inner">
    <span>{{ password }}</span>
    <button (click)="copiar()" class="text-gray-400 hover:text-white transition-colors p-2" title="Copiar">
      📋
    </button>
  </div>

  <div class="space-y-6">
    <div>
      <div class="flex justify-between mb-2">
        <span class="text-sm font-semibold text-gray-600">Longitud</span>
        <span class="text-sm font-bold text-blue-600">{{ largo }}</span>
      </div>
      <input type="range" [(ngModel)]="largo" (input)="generar()" min="5" max="128" 
             class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
      <p class="text-[10px] text-gray-400 mt-1">Usa 14 caracteres o más para mayor seguridad.</p>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <label class="flex items-center space-x-3 cursor-pointer group">
        <input type="checkbox" [(ngModel)]="includeUpper" (change)="generar()" class="w-5 h-5 rounded text-blue-600 border-gray-300 focus:ring-blue-500">
        <span class="text-sm text-gray-700 group-hover:text-blue-600 transition">A-Z</span>
      </label>

      <label class="flex items-center space-x-3 cursor-pointer group">
        <input type="checkbox" [(ngModel)]="includeLower" (change)="generar()" class="w-5 h-5 rounded text-blue-600 border-gray-300 focus:ring-blue-500">
        <span class="text-sm text-gray-700 group-hover:text-blue-600 transition">a-z</span>
      </label>

      <label class="flex items-center space-x-3 cursor-pointer group">
        <input type="checkbox" [(ngModel)]="includeNumbers" (change)="generar()" class="w-5 h-5 rounded text-blue-600 border-gray-300 focus:ring-blue-500">
        <span class="text-sm text-gray-700 group-hover:text-blue-600 transition">0-9</span>
      </label>

      <label class="flex items-center space-x-3 cursor-pointer group">
        <input type="checkbox" [(ngModel)]="includeSymbols" (change)="generar()" class="w-5 h-5 rounded text-blue-600 border-gray-300 focus:ring-blue-500">
        <span class="text-sm text-gray-700 group-hover:text-blue-600 transition">!@#$%^&*</span>
      </label>
    </div>
    
    <button (click)="generar()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all active:scale-95">
      Generar Nueva Contraseña
    </button>
  </div>
</div>
