<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-lg">
      <h2 class="text-2xl font-bold mb-4 text-gray-800">Contador de Texto</h2>
      <textarea [(ngModel)]="texto" rows="8" placeholder="Pega tu texto aquí..."
        class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition"></textarea>
      
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-6">
        <div class="bg-blue-50 p-4 rounded-xl text-center">
          <span class="block text-2xl font-black text-blue-600">{{ texto.length }}</span>
          <span class="text-xs text-blue-400 uppercase font-bold">Caracteres</span>
        </div>
        <div class="bg-green-50 p-4 rounded-xl text-center">
          <span class="block text-2xl font-black text-green-600">{{ contarPalabras() }}</span>
          <span class="text-xs text-green-400 uppercase font-bold">Palabras</span>
        </div>
        <div class="bg-purple-50 p-4 rounded-xl text-center">
          <span class="block text-2xl font-black text-purple-600">{{ contarLineas() }}</span>
          <span class="text-xs text-purple-400 uppercase font-bold">Líneas</span>
        </div>
        <div class="bg-orange-50 p-4 rounded-xl text-center">
          <span class="block text-2xl font-black text-orange-600">{{ leerTiempo() }}m</span>
          <span class="text-xs text-orange-400 uppercase font-bold">Lectura</span>
        </div>
      </div>
    </div>
