<div class="max-w-md mx-auto mt-10 p-8 bg-white rounded-3xl shadow-2xl border border-gray-100">
  <div class="flex items-center space-x-3 mb-8">
    <div class="bg-indigo-600 p-2 rounded-lg">
      <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
    </div>
    <h2 class="text-2xl font-bold text-gray-800">Recibo por Honorarios</h2>
  </div>

  <div class="space-y-6">
    <div>
      <label class="block text-sm font-bold text-gray-700 mb-2">Monto Bruto Total</label>
      <div class="relative">
        <span class="absolute left-4 top-3 text-gray-400 font-bold">$</span>
        <input type="number" [(ngModel)]="montoBruto" (input)="calcular()" placeholder="0.00"
          class="w-full pl-8 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition text-lg">
      </div>
    </div>

    <div class="bg-indigo-50 p-4 rounded-xl flex justify-between items-center">
      <span class="text-sm font-medium text-indigo-700">Retención de Impuestos ({{retencionPorcentaje}}%)</span>
      <select [(ngModel)]="retencionPorcentaje" (change)="calcular()" class="bg-white border-none rounded-lg text-sm font-bold p-1 text-indigo-600 outline-none">
        <option [value]="8">8%</option>
        <option [value]="10">10%</option>
        <option [value]="0">Sin retención</option>
      </select>
    </div>

    <div class="pt-6 border-t border-dashed border-gray-200 space-y-4">
      <div class="flex justify-between text-gray-500">
        <span>Retención calculada:</span>
        <span class="font-mono font-bold text-red-500">- {{ montoRetencion | number:'1.2-2' }}</span>
      </div>
      
      <div class="flex justify-between items-center bg-gray-900 p-5 rounded-2xl">
        <span class="text-gray-400 font-bold uppercase tracking-wider text-xs">Monto Neto a Recibir:</span>
        <span class="text-2xl font-black text-green-400 font-mono tracking-tighter">
          {{ montoNeto | number:'1.2-2' }}
        </span>
      </div>
    </div>

    <p class="text-[10px] text-gray-400 text-center italic">
      * Cálculo referencial basado en la tasa de impuestos seleccionada.
    </p>
  </div>
</div>
